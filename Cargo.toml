[package]
name = "quant-surface-stability"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "parse_corpus"
path = "src/parse_corpus.rs"

[dependencies]
arrow = "55"
parquet = "55"
clap = { version = "4", features = ["derive"] }
regex = "1"
walkdir = "2"
rayon = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
